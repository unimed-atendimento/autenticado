function abrirFormulario(){document.getElementById('startActions').style.display='none';document.getElementById('formArea').style.display='block';document.getElementById('preview').style.display='none';}
function hoje(){let d=new Date();let y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),a=String(d.getDate()).padStart(2,'0');return y+'-'+m+'-'+a}document.getElementById('venc').value=hoje();
function brData(v){if(!v)return'';let [y,m,d]=v.split('-');return d+'/'+m+'/'+y}function brValor(v){let n=Number(String(v).replace(/\./g,'').replace(',','.').replace(/[^0-9.-]/g,''));return isNaN(n)?v:n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}
function digits(s){return String(s).replace(/\D/g,'')}
function linhaParaCodigo(l){let d=digits(l);if(d.length!==47)return d;return d.slice(0,4)+d.slice(32,33)+d.slice(33,47)+d.slice(4,9)+d.slice(10,20)+d.slice(21,31)}
function i25(canvas,num){num=digits(num);if(num.length%2)num='0'+num;let pat=['00110','10001','01001','11000','00101','10100','01100','00011','10010','01010'];let seq='0000';for(let i=0;i<num.length;i+=2){let a=pat[+num[i]],b=pat[+num[i+1]];for(let j=0;j<5;j++)seq+=(a[j]=='1'?'111':'1')+'0'+(b[j]=='1'?'000':'0')+'1'}seq+='100';canvas.width=1000;canvas.height=130;let c=canvas.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,canvas.width,canvas.height);c.fillStyle='#000';let x=0,w=canvas.width/seq.length;for(let i=0;i<seq.length;i++){if(seq[i]=='1')c.fillRect(x,0,Math.ceil(w),canvas.height);x+=w}}
function gerar(){let l=document.getElementById('linha').value.trim(),inst=document.getElementById('inst').value.trim().toUpperCase(),nome=document.getElementById('nome').value.trim().toUpperCase(),cpf=document.getElementById('cpf').value.trim(),v='R$ '+brValor(document.getElementById('valor').value),dt=brData(document.getElementById('venc').value);let [bankName,bankCode]=document.getElementById('banco').value.split('|');tLinha1.textContent=l;tLinha2.textContent=l;tBanco1.textContent=bankCode;tBanco2.textContent=bankCode;bankLogo1.src=BANK_LOGOS[bankName]||'';bankLogo2.src=BANK_LOGOS[bankName]||'';tVenc1.textContent=dt;tDataDoc1.textContent=dt;tDataProc1.textContent=dt;tVenc2.textContent=dt;tDataDoc2.textContent=dt;tDataProc2.textContent=dt;tValor1.textContent=v;tValor2.textContent=v;tValor3.textContent=v;tPag1.innerHTML=nome+'<br>CPF: '+cpf;tPag2.innerHTML=nome+'<br>CPF: '+cpf;let agora=new Date(),meses=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];tCompetencia1.textContent='Boleto referente a Segunda Via – Competência '+meses[agora.getMonth()]+'/'+agora.getFullYear();tCompetencia2.textContent='Boleto referente a Segunda Via – Competência '+meses[agora.getMonth()]+'/'+agora.getFullYear();tInstituicaoInfo1.textContent='Informamos que o pagamento poderá ser efetuado por meio de código eletrônico, emitido pela Unimed em nome do Setor de Negociação Autorizado, devidamente credenciado pela '+inst+' e cadastrado pela Unimed para recebimentos oficiais.';i25(document.getElementById('barcode'),linhaParaCodigo(l));preview.style.display='block';setTimeout(()=>preview.scrollIntoView({behavior:'smooth'}),50)}
function salvar(){
  gerar();
  const nomeCliente=(document.getElementById('nome').value||'BOLETO UNIMED').trim().toUpperCase();
  const nomeArquivo=nomeCliente.replace(/[\\/:*?\"<>|]/g,'').replace(/\s+/g,' ').trim();
  const tituloAnterior=document.title;
  document.title=nomeArquivo;
  const restaurarTitulo=()=>{document.title=tituloAnterior;window.removeEventListener('afterprint',restaurarTitulo);};
  window.addEventListener('afterprint',restaurarTitulo);
  setTimeout(()=>window.print(),150);
}
function limpar(){['linha','inst','nome','cpf','valor'].forEach(id=>document.getElementById(id).value='');document.getElementById('venc').value=hoje();preview.style.display='none'}
